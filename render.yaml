# Render Blueprint: Dashboard -> New + -> Blueprint -> pick this repo. Render asks for the value marked sync: false (MONGO_URI).
# Optional settings (Razorpay, Cloudinary, ...) are listed in the README and can be added later under Environment.
services:
  - type: web
    name: lookout-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true # random, kept secret by Render
      - key: MONGO_URI
        sync: false # your Atlas connection string, with the database name, e.g. .../lookout?retryWrites=true&w=majority
      - key: CLIENT_URL
        value: https://look-out-theta.vercel.app # the website's address (no trailing slash; comma-separate several, e.g. a custom domain)
